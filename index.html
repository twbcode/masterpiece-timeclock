<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Masterpiece Time Clock</title>
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>

/* Layout: a light business app. White top bar; one centered column per screen; on a job, a 3-step
   progress bar (Estimate -> Sales Contract -> Final Invoice) with one action panel beside the document. */
:root {
  color-scheme: light;
  --bg: #f5f7f6;
  --surface: #ffffff;
  --subtle: #f0f3f2;
  --ink: #15201c;
  --muted: #5d6965;
  --faint: #8a9591;
  --line: #e1e6e4;
  --line-strong: #cdd5d2;
  --accent: #23604f;          /* Masterpiece green */
  --accent-hover: #1a4c3e;
  --accent-soft: #e7f1ed;
  --accent-ink: #ffffff;
  --warn: #8a4b00; --warn-bg: #fff4e2;
  --bad: #a3231b; --bad-bg: #fdecea;
  --good: #1f7a46; --good-bg: #e6f4ec;
  --shadow: 0 1px 2px rgba(16, 32, 26, .05), 0 1px 3px rgba(16, 32, 26, .06);
  --shadow-lg: 0 2px 4px rgba(16, 32, 26, .04), 0 12px 32px rgba(16, 32, 26, .10);
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 26px; line-height: 1.2; }
h3 { font-size: 18px; line-height: 1.3; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hint { font-size: 13.5px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

/* top bar */
.bar { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in, .main {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; color: inherit; cursor: pointer; font: inherit; }
.logo { height: 48px; width: auto; display: block; }
.brand-div { width: 1px; height: 28px; background: var(--line-strong); }
.mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.brand-name { font-weight: 700; font-size: 18px; color: var(--accent); letter-spacing: -0.01em; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.engine { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.engine[hidden] { display: none; }
@media (max-width: 560px) { #engine-text { display: none; } .brand-name { font-size: 16px; } .logo { height: 34px; } }
.engine .spin { width: 14px; height: 14px; border-width: 2px; }
.icon-btn { appearance: none; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn:hover { background: var(--subtle); color: var(--ink); }
.main { padding-block: 28px 56px; display: grid; gap: 24px; }
#view { display: grid; gap: 20px; min-width: 0; }

/* buttons */
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 15px; border-radius: 10px; cursor: pointer; padding: 10px 16px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; line-height: 1.2; text-decoration: none; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-text { background: none; color: var(--accent); padding: 6px 4px; }
.btn-danger { color: var(--bad); }
.btn-danger-solid { background: var(--bad); color: #fff; }
.job-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line, #e3e3e3); display: flex; justify-content: flex-end; }
.btn-text:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 3px; }
.btn-lg { font-size: 16px; padding: 13px 22px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.why { font-size: 13.5px; color: var(--muted); }
.why:empty { display: none; }

/* cards + fields */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; display: grid; gap: 18px; min-width: 0; align-content: start; }
.card-head { display: grid; gap: 4px; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; }
input[type="text"], input[type="search"], textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder, textarea::placeholder { color: var(--faint); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.money-in { position: relative; }
.money-in::before { content: "$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; }
.money-in input { padding-left: 26px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.check b { display: block; font-weight: 600; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 15px; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; font-weight: 700; width: 14px; }
details.more[open] > summary::before { content: "–"; }
details.more > div { display: grid; gap: 16px; margin-top: 14px; }
.opt { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--subtle); }
.sep { height: 1px; background: var(--line); }

.note { border-radius: 10px; padding: 11px 14px; font-size: 14.5px; display: grid; gap: 2px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note.ok { background: var(--good-bg); color: var(--good); }
.note pre { white-space: pre-wrap; font-size: 12px; margin: 6px 0 0; max-height: 200px; overflow: auto; color: var(--ink); }
.spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.busy { display: flex; align-items: center; gap: 12px; font-weight: 600; }

/* dialog */
dialog { border: none; border-radius: 16px; background: var(--surface); color: var(--ink); padding: 26px; max-width: min(480px, calc(100vw - 32px)); box-shadow: 0 24px 64px rgba(16, 32, 26, .25); }
dialog::backdrop { background: rgba(16, 28, 24, .35); }
dialog .dlg { display: grid; gap: 14px; }
dialog .row { justify-content: flex-end; margin-top: 6px; }
.settings-list { display: grid; gap: 10px; }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
.form-row > div:first-child { min-width: 0; }
.foot { font-size: 13px; color: var(--faint); text-align: center; }

/* ---------------------------------------------------------------- time clock */
input[type="password"], input[type="date"], input[type="time"], input[type="number"], select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
}
input[type="password"]:focus, input[type="date"]:focus, input[type="time"]:focus, input[type="number"]:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.narrow { max-width: 520px; margin: 4vh auto 0; width: 100%; }
.narrow .card { padding: 30px; gap: 18px; }
.wide { max-width: 1160px; width: 100%; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; }
.err:empty { display: none; }

/* kiosk home */
.now { display: grid; gap: 2px; justify-items: center; text-align: center; padding: 8px 0 4px; }
.now-time { font-size: clamp(44px, 9vw, 72px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.now-date { font-size: 18px; color: var(--muted); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.tile { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 10px; transition: border-color .15s, background .15s; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
.tile .nm { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; line-height: 1.25; }
.tile .pos { font-size: 13.5px; color: var(--muted); }
.tile.add { border-style: dashed; box-shadow: none; background: transparent; place-items: center; text-align: center; color: var(--accent); font-weight: 600; min-height: 116px; }
.chip { justify-self: start; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.in { background: var(--good-bg); color: var(--good); }
.chip.out { background: var(--subtle); color: var(--muted); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }

/* sign in */
.who-big { display: flex; gap: 14px; align-items: center; }
.who-big .avatar { width: 52px; height: 52px; font-size: 19px; }

/* employee page */
.clock-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
@media (max-width: 640px) { .clock-card { grid-template-columns: 1fr; } }
.state { font-size: 15px; color: var(--muted); }
.state b { color: var(--ink); }
.bigbtn { appearance: none; font: inherit; font-weight: 700; font-size: 22px; border: none; border-radius: 16px; padding: 22px 40px; cursor: pointer; color: #fff; min-width: 240px; box-shadow: var(--shadow-lg); display: inline-flex; gap: 10px; align-items: center; justify-content: center; }
.bigbtn.in { background: var(--accent); }
.bigbtn.in:hover { background: var(--accent-hover); }
.bigbtn.out { background: #8a2e22; }
.bigbtn.out:hover { background: #73261c; }
.bigbtn:disabled { opacity: .5; cursor: progress; }
@media (max-width: 640px) { .bigbtn { width: 100%; min-width: 0; } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; background: var(--surface); }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat.hi { background: var(--accent-soft); border-color: transparent; }
.stat.hi b { color: var(--accent); }
.stat em { font-style: normal; font-size: 12.5px; font-weight: 600; }
.wk-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wk-nav .lbl { font-weight: 700; font-size: 17px; }
.wk-nav .sub { font-size: 14px; color: var(--muted); }
.navbtn { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; color: var(--ink); font-size: 18px; }
.navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.navbtn:disabled { opacity: .35; cursor: default; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 10px 12px; background: var(--subtle); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--subtle); }
.tbl tfoot td { font-weight: 700; background: var(--subtle); border-top: 1px solid var(--line-strong); }
.tbl .day { font-weight: 600; white-space: nowrap; }
.tbl .weekend { color: var(--muted); }
.punches { display: flex; flex-wrap: wrap; gap: 6px; }
.pair { display: inline-flex; gap: 6px; align-items: center; background: var(--subtle); border-radius: 8px; padding: 3px 8px; white-space: nowrap; font-size: 14px; }
.pair.open { background: var(--good-bg); color: var(--good); font-weight: 600; }
.pair.bad { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--subtle); color: var(--muted); white-space: nowrap; }
.tag.pto { background: #e8eefc; color: #2b4a9b; }
.tag.sick { background: #f6e9f5; color: #85307d; }
.tag.hol { background: #e9f4f8; color: #1d6178; }
.tag.est { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--good-bg); color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }

/* manage */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { appearance: none; background: none; border: none; font: inherit; font-weight: 600; font-size: 15px; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.count { background: var(--bad); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; font-weight: 700; }
.list { display: grid; gap: 10px; }
.item-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.item-row > div:first-child { min-width: 0; display: grid; gap: 2px; }
.item-row .t { font-weight: 600; }
.item-row .s { font-size: 14px; color: var(--muted); }
.mini { font-size: 13.5px; padding: 6px 11px; border-radius: 8px; }
.entry-list { display: grid; gap: 6px; }
.entry { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkx { appearance: none; background: none; border: none; color: var(--bad); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.linkx:hover { background: var(--bad-bg); }
.linke { appearance: none; background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.linke:hover { background: var(--accent-soft); }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 24px; font-weight: 700; letter-spacing: .08em; text-align: center; padding: 16px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.hol-list { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
.toast[hidden] { display: none; }
.who-bar { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.who-bar b { color: var(--ink); }

/* print: just the content */
@media print {
  .bar, .no-print, .tabs, .foot, .toast { display: none !important; }
  body { background: #fff; }
  .main { padding: 0; }
  .card { box-shadow: none; border: none; padding: 0; }
  .tbl-wrap { border: 1px solid #999; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

/* small screens: keep the top bar on one tidy line */
#sign-out, #go-manage { white-space: nowrap; }
@media (max-width: 720px) { .who-bar { display: none !important; } }
@media (max-width: 480px) { .bar-in:has(#sign-out:not([hidden])) .brand-div, .bar-in:has(#sign-out:not([hidden])) .brand-name { display: none; } }
.wk-nav { flex-wrap: nowrap; }
.wk-nav > div { min-width: 0; }
.navbtn { flex: none; }
[hidden] { display: none !important; }

/* paper time sheets (printed only) */
#print-area { display: none; }
@media print {
  body.printing > *:not(#print-area) { display: none !important; }
  body.printing #print-area { display: block; }
  @page { size: letter; margin: 0.5in; }
}
.sheet { font-family: var(--font); color: #000; font-size: 12.5px; page-break-after: always; break-after: page; }
.sheet:last-child { page-break-after: auto; break-after: auto; }
.sh-head { display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
.sh-logo { height: 54px; width: auto; }
.sh-head h1 { font-size: 22px; margin: 0; }
.sh-head p { margin: 0; color: #333; }
.sheet table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.sheet th, .sheet td { border: 1px solid #555; padding: 6px 8px; text-align: left; vertical-align: middle; }
.sheet th { background: #eee; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.sh-info th { width: 14%; }
.sh-grid td { height: 30px; white-space: nowrap; }
.sh-grid td:last-child { white-space: normal; font-size: 11.5px; }
.sh-grid tfoot td { font-weight: 700; background: #f4f4f4; }
.sh-tot th, .sh-tot td { text-align: center; }
.sheet .num { text-align: right; }
.sh-bal { margin: 0 0 8px; }
.sh-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 40px; }
.sh-sign div { display: flex; align-items: flex-end; gap: 8px; white-space: nowrap; }
.sh-sign span { flex: 1; border-bottom: 1px solid #000; height: 20px; }
.sh-sign span.d { flex: 0 0 90px; }
.sh-foot { margin-top: 24px; font-size: 10.5px; color: #555; }
/* tab bar: scrolls sideways only (no up/down wobble on phones) */
.tabs { overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { margin-bottom: 0; flex: none; }

/* notifications */
.bell-wrap { position: relative; }
.bell { position: relative; padding: 8px; color: var(--ink); }
.bell .dot { position: absolute; top: 5px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: #d62f22; border: 2px solid var(--surface); }
.bell-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(400px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 40; }

<script>
/* ================================================================================================
   Hours and payroll math, shared by the time clock page and the private server, so the Thursday
   5 PM email shows exactly what the page shows. Dates are worked out in the office's local time.
   ctx: { off(t) -> minutes behind UTC (like Date.getTimezoneOffset), now() -> ms,
          settings() -> settings object, rows(dir) -> [{ name, o }] for the records directly in that folder }
   ================================================================================================ */
function MpcPay(ctx) {
  var OT_LIMIT = 40, PK = ["reg", "ot", "pto", "sick", "holiday", "total"];
  var MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DOW = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function r2(x) { return Math.round(x * 100) / 100; }
  function hrs(x) { return (Math.round(x * 100) / 100).toFixed(2); }
  function sgn(v) { return (v > 0 ? "+" : "") + hrs(v); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fullName(e) { return e ? (e.first + " " + e.last).trim() : "Someone"; }
  function ZERO() { return { reg: 0, ot: 0, pto: 0, sick: 0, holiday: 0, total: 0 }; }
  function now() { return ctx.now(); }

  /* ---------- dates ---------- */
  function utcKey(ms) { var d = new Date(ms); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()); }
  function keyUTC(k) { var p = k.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function dayKey(t) { return utcKey(t - ctx.off(t) * 60000); }
  function addKey(k, n) { return utcKey(keyUTC(k) + n * 864e5); }
  function dowOf(k) { return (new Date(keyUTC(k)).getUTCDay() + 6) % 7; }        // 0 = Monday
  function weekOf(t) { var k = dayKey(t); return addKey(k, -dowOf(k)); }
  function weekDays(wk) { var o = []; for (var i = 0; i < 7; i++) o.push(addKey(wk, i)); return o; }
  function fridayOf(wk) { return addKey(wk, 4); }
  function shiftWeek(wk, n) { return addKey(wk, 7 * n); }
  function startOf(k) { var u = keyUTC(k); return u + ctx.off(u + ctx.off(u) * 60000) * 60000; }   // local midnight
  function fmtTime(t) { var d = new Date(t - ctx.off(t) * 60000), h = d.getUTCHours(); return (h % 12 || 12) + ":" + pad2(d.getUTCMinutes()) + " " + (h < 12 ? "AM" : "PM"); }
  function fmtDay(k) { var d = new Date(keyUTC(k)); return DOW[dowOf(k)].slice(0, 3) + ", " + MON[d.getUTCMonth()].slice(0, 3) + " " + d.getUTCDate(); }
  function fmtDate(k) { var d = new Date(keyUTC(k)); return MON[d.getUTCMonth()].slice(0, 3) + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); }
  function fmtLong(k) { var d = new Date(keyUTC(k)); return DOW[dowOf(k)] + ", " + MON[d.getUTCMonth()] + " " + d.getUTCDate() + ", " + d.getUTCFullYear(); }
  function fmtStamp(t) { return fmtDate(dayKey(t)) + ", " + fmtTime(t); }
  function shortDay(k) { return DOW[dowOf(k)].slice(0, 3); }
  function weekLc(wk) { return "week ending Friday, " + fmtDate(fridayOf(wk)); }
  function weekRange(wk) { return fmtDay(wk) + " – " + fmtDay(fridayOf(wk)); }

  /* ---------- records ---------- */
  function settings() { return ctx.settings() || {}; }
  function eventsFor(wk, empId) {
    return ctx.rows("events/" + wk + "/" + empId).map(function (r) { var o = {}; for (var k in r.o) o[k] = r.o[k]; o.id = r.name.replace(/\.json$/, ""); return o; })
      .sort(function (a, b) { return (a.created - b.created) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); });
  }
  function metaFor(wk) {
    var out = ctx.rows("events/" + wk + "/_week").map(function (r) { return r.o; }).sort(function (a, b) { return a.created - b.created; });
    var last = null; for (var i = out.length - 1; i >= 0; i--) if (out[i].type === "lock" || out[i].type === "unlock") { last = out[i]; break; }
    return { locked: !!last && last.type === "lock", lock: last && last.type === "lock" ? last : null, history: out };
  }

  /* ---------- one person's week ---------- */
  function roundT(t) { var m = Number(settings().round) || 0; return m ? Math.round(t / (m * 60000)) * m * 60000 : t; }
  function holidaysIn(wk) { var days = weekDays(wk).slice(0, 5); return (settings().holidays || []).filter(function (h) { return days.indexOf(h.date) >= 0; }); }
  function computeWeek(emp, wk, evs, nowT) {
    if (nowT == null) nowT = now();
    var voided = {}; evs.forEach(function (v) { if (v.type === "void") voided[v.target] = 1; });
    var live = evs.filter(function (e) { return !voided[e.id]; });
    var moves = {}; live.forEach(function (e) { if (e.type === "move") moves[e.target] = e.at; });
    var days = weekDays(wk).map(function (k) { return { key: k, pairs: [], minutes: 0, entries: [], issues: [], worked: 0 }; });
    function dayOf(t) { var k = dayKey(t); for (var i = 0; i < days.length; i++) if (days[i].key === k) return days[i]; return null; }
    var punches = live.filter(function (e) { return e.type === "punch"; }).map(function (e) {
      return { id: e.id, dir: e.dir, at: moves[e.id] != null ? moves[e.id] : e.at, how: e.how, by: e.by, moved: moves[e.id] != null, loc: e.loc || null, phone: !!e.phone, device: e.device || "" };
    }).sort(function (a, b) { return a.at - b.at; });
    var open = null, liveMin = 0, clockedIn = null, issues = [];
    function addPair(i, o) {
      var d = dayOf(i ? i.at : o.at); if (!d) return null;
      var p = { "in": i, out: o };
      if (i && o) { p.min = Math.max(0, (roundT(o.at) - roundT(i.at)) / 60000); d.minutes += p.min; }
      d.pairs.push(p); return p;
    }
    punches.forEach(function (p) {
      if (p.dir === "in") {
        if (open) { var x = addPair(open, null); if (x) { x.bad = "No clock-out"; dayOf(open.at).issues.push("Clocked in at " + fmtTime(open.at) + " without clocking out"); } }
        open = p;
      } else if (open) { addPair(open, p); open = null; }
      else { var y = addPair(null, p); if (y) { y.bad = "No clock-in"; dayOf(p.at).issues.push("Clocked out at " + fmtTime(p.at) + " without clocking in"); } }
    });
    if (open) {
      var z = addPair(open, null);
      if (z && dayKey(open.at) === dayKey(nowT) && nowT - open.at < 18 * 3600000) { z.live = true; clockedIn = open; liveMin = Math.max(0, (nowT - roundT(open.at)) / 60000); }
      else if (z) { z.bad = "No clock-out"; dayOf(open.at).issues.push("Missed clock-out after " + fmtTime(open.at)); }
    }
    live.forEach(function (e) {   // hours added by the manager or approved requests
      if (e.type !== "hours") return;
      days.forEach(function (d) { if (d.key === e.date) d.entries.push({ id: e.id, cat: e.cat, hours: Number(e.hours) || 0, note: e.note || "", by: e.by }); });
    });
    holidaysIn(wk).forEach(function (h) {   // company holidays count automatically unless taken off for this person
      if (emp.created && h.date < dayKey(emp.created)) return;   // not before they were added
      var off = live.some(function (e) { return e.type === "holiday_off" && e.date === h.date; });
      days.forEach(function (d) {
        if (d.key === h.date && !off && !d.entries.some(function (x) { return x.cat === "holiday"; })) d.entries.push({ id: null, cat: "holiday", hours: Number(h.hours) || 0, note: h.name, auto: true });
      });
    });
    var T = { worked: 0, pto: 0, sick: 0, holiday: 0 };
    var sumCat = function (d, c) { return d.entries.filter(function (x) { return x.cat === c; }).reduce(function (s, x) { return s + x.hours; }, 0); };
    days.forEach(function (d) {
      d.worked = d.minutes / 60 + sumCat(d, "worked");
      T.worked += d.worked; T.pto += sumCat(d, "pto"); T.sick += sumCat(d, "sick"); T.holiday += sumCat(d, "holiday");
      d.issues.forEach(function (t) { issues.push(fmtDay(d.key) + ": " + t); });
    });
    var worked = r2(T.worked), reg = r2(Math.min(worked, OT_LIMIT)), ot = r2(Math.max(0, worked - OT_LIMIT));
    var lastOf = function (type) { for (var i = live.length - 1; i >= 0; i--) if (live[i].type === type) return live[i]; return null; };
    var otEv = lastOf("ot"), otApproved = otEv ? Number(otEv.hours) : null;
    var otStatus = ot <= 0 ? "none" : otApproved == null ? "pending" : Math.abs(otApproved - ot) < 0.01 ? "approved" : "changed";
    var sign = lastOf("signoff");
    var changedAfterSign = sign ? live.some(function (e) { return e.created > sign.created && e.type !== "signoff"; }) : false;
    var total = r2(reg + ot + T.pto + T.sick + T.holiday);
    return { emp: emp, wk: wk, days: days, punches: punches, clockedIn: clockedIn, liveMin: liveMin, issues: issues, worked: worked, reg: reg, ot: ot, otApproved: otApproved, otStatus: otStatus,
      pto: r2(T.pto), sick: r2(T.sick), holiday: r2(T.holiday), total: total, signed: sign || null, changedAfterSign: changedAfterSign };
  }
  function weekFor(emp, wk) { return computeWeek(emp, wk, eventsFor(wk, emp.id)); }
  function snapOf(w) { return { reg: w.reg, ot: w.ot, pto: w.pto, sick: w.sick, holiday: w.holiday, total: w.total }; }

  /* ---------- payroll ----------
     Doing payroll locks the week and saves the hours paid. When it's done before the week is over (Thursday),
     the rest of the week is estimated. Once the real times are in, any difference is added to the next payroll. */
  function weekOver(wk) { return now() >= startOf(addKey(wk, 5)); }                         // from Saturday morning
  function paidEarly(meta, wk) { return !!(meta && meta.locked && meta.lock.created < startOf(addKey(wk, 5))); }
  function thursday5pm(wk) { return startOf(addKey(wk, 3)) + 17 * 3600000; }
  function carriedFor(empId, wk, exceptWk) {   // corrections for wk already put into later payrolls
    var sum = ZERO(), where = [], top = weekOf(now());
    for (var x = shiftWeek(wk, 1), n = 0; x <= top && n < 12; x = shiftWeek(x, 1), n++) {
      if (x === exceptWk) continue;
      var m = metaFor(x), s = m.locked && m.lock.snapshot && m.lock.snapshot[empId];
      ((s && s.corr) || []).forEach(function (c) {
        if (c.wk !== wk) return;
        PK.forEach(function (k) { sum[k] = r2(sum[k] + (Number(c[k]) || 0)); });
        if (where.indexOf(x) < 0) where.push(x);
      });
    }
    return { sum: sum, where: where };
  }
  function payState(emp, wk, w, meta, exceptWk) {   // what was paid, corrections since, and any difference still to pay
    if (!meta.locked) return null;
    var s = (meta.lock.snapshot || {})[emp.id] || null, p = s || ZERO(), act = snapOf(w), car = carriedFor(emp.id, wk, exceptWk);
    var diff = {}; PK.forEach(function (k) { diff[k] = r2(act[k] - (Number(p[k]) || 0) - car.sum[k]); });
    var over = weekOver(wk);
    return { s: s, over: over, car: car, diff: diff, paid: r2((Number(p.total) || 0) + car.sum.total), open: over && PK.some(function (k) { return Math.abs(diff[k]) >= 0.01; }) };
  }
  function correctionsFor(emp, wk) {
    var out = [];
    for (var n = 10; n >= 1; n--) {
      var v = shiftWeek(wk, -n); if (!weekOver(v)) continue;
      var m = metaFor(v); if (!m.locked) continue;
      var w = weekFor(emp, v), st = payState(emp, v, w, m, wk);
      if (st && st.open) { var c = { wk: v, paid: st.paid, actual: w.total, missed: w.issues.length > 0 }; PK.forEach(function (k) { c[k] = st.diff[k]; }); out.push(c); }
    }
    return out;
  }
  function correctionsAll(wk, emps) {
    var out = {}; emps.filter(function (e) { return e.hourly !== false; }).forEach(function (e) { var c = correctionsFor(e, wk); if (c.length) out[e.id] = c; });
    return out;
  }
  function typicalDay(emp, wk, idx) {   // usual hours on that weekday, from the last 3 weeks
    var vals = [], today = dayKey(now());
    for (var n = 1; n <= 3; n++) {
      var w = weekFor(emp, shiftWeek(wk, -n)); if (!(w.worked > 0)) continue;
      var d = w.days[idx]; if (d.entries.some(function (x) { return x.cat === "pto" || x.cat === "sick" || x.cat === "holiday"; })) continue;
      vals.push(d.worked);
    }
    if (!vals.length) {
      var cur = weekFor(emp, wk);
      var done = cur.days.slice(0, 5).filter(function (d) { return d.key < today && d.worked > 0; }).map(function (d) { return d.worked; });
      vals.push(done.length ? done.reduce(function (a, b) { return a + b; }, 0) / done.length : 8);
    }
    return Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 4) / 4;
  }
  function after5(k) { return now() >= startOf(k) + 17 * 3600000; }
  function estimateDays(wk) {   // weekdays not worked yet (today counts as worked from 5 PM on)
    var today = dayKey(now()); return weekDays(wk).slice(0, 5).filter(function (k) { return k > today || (k === today && !after5(today)); });
  }
  function liveHours(w, k) { return w.clockedIn && dayKey(w.clockedIn.at) === k ? w.liveMin / 60 : 0; }
  function suggestFor(w, wk, k) {   // the hours to fill in for a day that isn't over yet
    var today = dayKey(now()), i = weekDays(wk).indexOf(k), d = w.days[i];
    var off = d.entries.filter(function (x) { return x.cat === "pto" || x.cat === "sick" || x.cat === "holiday"; }).reduce(function (a, x) { return a + x.hours; }, 0);
    var doneToday = k === today && d.pairs.length && !d.pairs.some(function (p) { return p.live || p.bad; });
    if (doneToday) return r2(d.worked);
    return Math.max(0, typicalDay(w.emp, wk, i) - off);

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };

let mock = null;
class ApiError extends Error { constructor(m, code) { super(m); this.code = code; } }
async function api(a, body = {}) {
  const req = Object.assign({ a, dev: Conn.dev || null, tok: S.tok || null, tz: new Date().getTimezoneOffset() }, body);
  let res;
  if (MOCK) { mock = mock || MpcMockServer(params.get("mock") || "1"); res = await mock.call(req); }
  else {
    if (!Conn.url) throw new ApiError("This computer isn't connected to the time clock. Open your invite email on it.", "nodevice");
    let r;
    try { r = await fetch(Conn.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(req), redirect: "follow" }); }
    catch (_) { throw new ApiError("The time clock needs an internet connection. Check the internet and try again.", "offline"); }
    try { res = await r.json(); } catch (_) { throw new ApiError("The time clock server didn't answer properly. Try again in a minute.", "server"); }
  }
  if (!res.ok) {
    if (res.code === "signedout" && S.emp) { S.emp = null; S.tok = null; Mirror.clear(); paintBar(); go("home"); toast("You were signed out. Please sign in again."); }
    throw new ApiError(res.error, res.code);
  }
  return res.r;
}

async function syncNow() {
  if (!S.tok) return;

  syncing = (async () => {
    const r = await api("sync", { since: Mirror.seq });
    for (const row of r.rows) Mirror.set(row.path, row.data);
    Mirror.seq = Math.max(Mirror.seq, r.seq);
    if (r.me && S.emp && r.me.id === S.emp.id) Object.assign(S.emp, r.me);

const under = (parts) => parts.length ? parts.join("/") + "/" : "";
async function listJson(parts) {
  const pre = under(parts), out = [];
  for (const k of Mirror.rows.keys()) if (k.startsWith(pre) && !k.slice(pre.length).includes("/") && /\.(json|csv)$/i.test(k)) out.push(k.slice(pre.length));
  return out.sort();
}
async function listDirs(parts) {
  const pre = under(parts), out = new Set();
  for (const k of Mirror.rows.keys()) if (k.startsWith(pre)) { const rest = k.slice(pre.length); if (rest.includes("/")) out.add(rest.split("/")[0]); }
  return [...out].sort();
}

/* ================================================================ passwords (checked by the server) */
function newCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r = crypto.getRandomValues(new Uint8Array(12));
  return [...r].map(x => A[x % A.length]).join("").replace(/(.{4})(?=.)/g, "$1-");
}
/* password rules: at least 8 characters, an uppercase letter, a lowercase letter and a special character */

const pwProblem = (a, b) => a.length < 8 ? "The password needs at least 8 characters."
  : !/[A-Z]/.test(a) ? "The password needs at least one uppercase letter (A–Z)."
  : !/[a-z]/.test(a) ? "The password needs at least one lowercase letter (a–z)."
  : !/[^A-Za-z0-9]/.test(a) ? "The password needs at least one special character, like ! # $ or ?."
  : a !== b ? "The two passwords don't match." : "";
const pwHint = '<p class="hint">' + PW_RULES + '</p>';

const pinProblem = (a, b) => !/^[0-9]{6}$/.test(a) ? "The PIN needs exactly 6 numbers." : /^(.)\1{5}$/.test(a) ? "Pick a PIN that isn't the same number 6 times."
  : "0123456789".includes(a) || "9876543210".includes(a) ? "Pick a PIN that isn't a straight run like 123456." : a !== b ? "The two PINs don't match." : "";
const pinField = (id, label) => '<div class="field"><label for="' + id + '">' + label + '</label><input type="password" id="' + id + '" class="pin-in" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>';

/* Two kinds: messages (saved, like "your time off was approved") and to-dos (worked out live, like an
   overtime approval waiting). Each person's notes are in notes/<id>/; only that person marks them read. */

async function loadNotes(empId) {

  for (const n of await listJson(["notes", empId])) { if (n === "read-todos.json") continue; const o = await readJson(["notes", empId], n); if (o && !o._broken) out.push(Object.assign({ file: n }, o)); }
  return out.sort((a, b) => b.t - a.t).slice(0, 60);

async function readTodoKeys(empId) { const o = await readJson(["notes", empId], "read-todos.json"); return new Set((o && o.keys) || []); }
async function saveTodoKeys(empId, set) { await writeJson(["notes", empId], "read-todos.json", { keys: [...set].slice(-300) }); }
async function computeTodos(emp) {
  const out = []; const now = new Date(); const thisWk = weekOf(now);
  if (emp.admin && !S.pin) {
    try { const dv = await api("devices"); for (const d of dv.devices.filter(x => x.status === "pending")) out.push({ key: "dev:" + d.id, t: d.created, text: "A new computer wants to use the time clock (" + d.label + "). Allow it only if it's an office computer.", link: { v: "manage", tab: "team" } }); } catch (_) {}
    const reqs = (await loadRequests()).filter(r => r.status === "pending" && D.emps.some(e => e.id === r.emp));
    for (const r of reqs) out.push({ key: "req:" + r.id, t: r.created, text: nameOf(r.emp) + " is asking for " + (r.kind === "fix" ? "a missed punch fix, " + fmtDay(r.date) : (CATS[r.kind] || r.kind) + ", " + (r.dates || [r.date]).map(fmtDay).join(", ")) + ". Approve or decline it.", link: { v: "manage", tab: "cards" } });
    const hourly = active().filter(e => e.hourly !== false);
    const mkNow = monthKey(now);
    if (active().some(e => Number(e.monthPto) > 0 || Number(e.monthSick) > 0)) {
      let has = false; for (const e of active()) if ((await ledger(e.id)).some(x => x.ref === "month:" + mkNow)) { has = true; break; }
      if (!has) out.push({ key: "month:" + mkNow, t: new Date(now.getFullYear(), now.getMonth(), 1).getTime(), text: "Add " + monthLabel(mkNow).split(" ")[0] + "'s earned PTO and sick hours.", link: { v: "manage", tab: "team", monthly: true } });
    }
    if (now.getDay() === 4 || now.getDay() === 5) {
      const m0 = await weekMeta(thisWk);
      if (!m0.locked) out.push({ key: "pay:" + thisWk, t: new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), text: "Payroll day: do payroll for " + weekLc(thisWk) + ".", link: { v: "manage", tab: "cards", wk: thisWk } });
    }
    for (const n of [0, -1, -2, -3]) {
      const wk = shiftWeek(thisWk, n); const meta = n < 0 ? await weekMeta(wk) : null;
      let anyHours = false;
      for (const e of hourly) {
        const w = await weekFor(e, wk); if (w.total > 0) anyHours = true;
        if (w.otStatus === "pending" || w.otStatus === "changed") out.push({ key: "ot:" + e.id + ":" + wk + ":" + w.ot, t: fromKey(fridayOf(wk)).getTime(), text: fullName(e) + " has " + hrs(w.ot) + " h overtime for " + weekLc(wk) + ". It needs your approval.", link: { v: "empweek", id: e.id, wk } });
        if (w.issues.length && n >= -1) out.push({ key: "miss:" + e.id + ":" + wk + ":" + w.issues.length, t: Date.now() - 1, text: fullName(e) + " has a missed punch (" + w.issues[0] + ").", link: { v: "empweek", id: e.id, wk } });
      }
      if (n < 0 && n >= -2 && anyHours && meta && !meta.locked) out.push({ key: "lock:" + wk, t: addDays(fromKey(wk), 7).getTime(), text: "Payroll for " + weekLc(wk) + " hasn't been done yet.", link: { v: "manage", tab: "cards", wk } });
    }
  }
  if (emp.hourly !== false) {
    for (const n of [0, -1]) {
      const wk = shiftWeek(thisWk, n); const w = await weekFor(emp, wk); const meta = await weekMeta(wk);
      if (w.issues.length) out.push({ key: "mymiss:" + wk + ":" + w.issues.length, t: Date.now() - 2, text: "You have a missed punch: " + w.issues[0] + ". Send a fix request.", link: { v: "me", wk } });
      if (!((!meta.locked || paidEarly(meta, wk)) && w.total > 0 && !(w.signed && !w.changedAfterSign))) continue;
      const day = now.getDay(), today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      if (n < 0) out.push({ key: "confirm:" + wk, t: fromKey(fridayOf(wk)).getTime(), text: "Please check and confirm your hours for " + weekLc(wk) + ".", link: { v: "me", wk } });
      else if (day === 4) out.push({ key: "confirm:" + wk + ":thu", t: today0, text: "Payroll is done today at 5 PM. Please check and confirm your hours so far this week.", link: { v: "me", wk } });
      else if (day === 5 || day === 6 || day === 0) out.push({ key: "confirm:" + wk + ":fri", t: today0, text: "Please check and confirm your hours for this week.", link: { v: "me", wk } });
    }
  }
  return out;
}
let bellItems = [];
async function refreshBell() {
  if (!S.emp) { $("#bell-wrap").hidden = true; return; }

  const [notes, todos, readKeys] = await Promise.all([loadNotes(emp.id), computeTodos(emp), readTodoKeys(emp.id)]);
  if (!S.emp || S.emp.id !== emp.id) return;
  bellItems = todos.map(x => Object.assign({ todo: true, read: readKeys.has(x.key) }, x)).concat(notes.map(x => Object.assign({ todo: false }, x)))
    .sort((a, b) => (a.read - b.read) || (b.todo - a.todo) || (b.t - a.t));

async function markRead(items) {
  const emp = S.emp; if (!emp) return;
  const todos = items.filter(x => x && x.todo && !x.read), notes = items.filter(x => x && !x.todo && !x.read);
  items.forEach(x => { if (x) x.read = true; });
  $("#bell-dot").hidden = !bellItems.some(x => !x.read);
  if (!$("#bell-panel").hidden) drawBell();
  try {
    if (todos.length) { const k = await readTodoKeys(emp.id); todos.forEach(x => k.add(x.key)); await saveTodoKeys(emp.id, k); }
    for (const n of notes) { const o = await readJson(["notes", emp.id], n.file); if (o) { o.read = true; await writeJson(["notes", emp.id], n.file, o); } }
  } catch (e) { console.error(e); }
}

function ask({ title, text, html, buttons, wide, onOpen }) {
  return new Promise(res => {
    $("#dlg-body").innerHTML = '<h3>' + esc(title) + '</h3>' + (text ? '<p class="muted">' + esc(text) + '</p>' : "") + (html || "") +
      '<div class="row">' + buttons.map((b, i) => '<button class="btn ' + (b.kind || "btn-secondary") + '" type="button" data-i="' + i + '">' + esc(b.label) + '</button>').join("") + '</div>';
    dlg.style.maxWidth = wide ? "min(620px, calc(100vw - 32px))" : "";
    let done = false;
    const finish = (v) => { if (done) return; done = true; dlg.removeEventListener("cancel", onCancel); if (dlg.open) dlg.close(); res(v); };
    const onCancel = (e) => { e.preventDefault(); finish(null); };
    dlg.addEventListener("cancel", onCancel);
    $$("[data-i]", dlg).forEach(b => b.addEventListener("click", async () => {
      const B = buttons[+b.dataset.i];
      if (B.check) { const ok = await B.check(); if (!ok) return; }
      finish(B.value);
    }));
    dlg.showModal();
    if (onOpen) onOpen(finish);
    const f = $("input, select, textarea", dlg); if (f) f.focus();
  });

/* federal holidays, observed on Friday or Monday when they fall on a weekend */
function nthDow(y, m, dow, n) { const d = new Date(y, m, 1); const off = (dow - d.getDay() + 7) % 7; return new Date(y, m, 1 + off + 7 * (n - 1)); }
function lastDow(y, m, dow) { const d = new Date(y, m + 1, 0); return new Date(y, m, d.getDate() - ((d.getDay() - dow + 7) % 7)); }
const observed = (d) => d.getDay() === 6 ? addDays(d, -1) : d.getDay() === 0 ? addDays(d, 1) : d;
function suggestedHolidays(y) {
  const tg = nthDow(y, 10, 4, 4);
  return [
    { key: "newyear", name: "New Year's Day", date: observed(new Date(y, 0, 1)), on: true },
    { key: "mlk", name: "Martin Luther King Jr. Day", date: nthDow(y, 0, 1, 3), on: false },
    { key: "pres", name: "Presidents' Day", date: nthDow(y, 1, 1, 3), on: false },
    { key: "memorial", name: "Memorial Day", date: lastDow(y, 4, 1), on: true },
    { key: "june", name: "Juneteenth", date: observed(new Date(y, 5, 19)), on: false },
    { key: "july4", name: "Independence Day", date: observed(new Date(y, 6, 4)), on: true },
    { key: "labor", name: "Labor Day", date: nthDow(y, 8, 1, 1), on: true },
    { key: "columbus", name: "Columbus Day", date: nthDow(y, 9, 1, 2), on: false },
    { key: "veterans", name: "Veterans Day", date: observed(new Date(y, 10, 11)), on: false },
    { key: "thanks", name: "Thanksgiving Day", date: tg, on: true },
    { key: "thanks2", name: "Day after Thanksgiving", date: addDays(tg, 1), on: true },
    { key: "xmaseve", name: "Christmas Eve", date: observed(new Date(y, 11, 24)), on: false },
    { key: "xmas", name: "Christmas Day", date: observed(new Date(y, 11, 25)), on: true },
    { key: "nye", name: "New Year's Eve", date: observed(new Date(y, 11, 31)), on: false },
  ].map(h => Object.assign(h, { date: dayKey(h.date) }));
}
function holidayChecklist(y, existing = []) {
  return '<div class="hol-list" data-year="' + y + '">' + suggestedHolidays(y).map(h => {
    const have = existing.some(x => x.date === h.date);
    return '<label class="check"><input type="checkbox" data-hol="' + h.key + '"' + ((have || (!existing.length && h.on)) ? " checked" : "") + (have ? " disabled" : "") + '><span><b>' + esc(h.name) + '</b><span class="hint">' + esc(fmtLong(h.date)) + (have ? " · already added" : "") + '</span></span></label>';
  }).join("") + '</div>';
}
function readChecklist(box, hours) {
  const y = +box.dataset.year; const S0 = suggestedHolidays(y);
  return $$("input[data-hol]:checked:not(:disabled)", box).map(i => { const h = S0.find(x => x.key === i.dataset.hol); return { id: uid(), date: h.date, name: h.name, hours }; });
}

/* mode: "first" (can wait), "temp" (must replace a temporary PIN), "change" (from My Time) */

/* ================================================================ an employee's own page */
function weekTable(w, { admin = false } = {}) {
  const rows = w.days.map((d, i) => {
    const wkend = i >= 5;
    if (wkend && !d.pairs.length && !d.entries.length && !admin) return "";
    const pairs = d.pairs.map(p => {
      const a = p.in ? fmtTime(p.in.at) : "—", b = p.out ? fmtTime(p.out.at) : p.live ? "now" : "—";
      const how = (p.in && p.in.how !== "clock") || (p.out && p.out.how !== "clock") ? ' <span class="tag" title="Entered by hand or from a request, not with the clock button">added</span>' : "";
      const ed = admin ? locBit(p.in) + locBit(p.out) : "";
      return '<span class="pair' + (p.live ? " open" : p.bad ? " bad" : "") + '">' + a + ' – ' + b + (p.bad ? " (" + esc(p.bad) + ")" : "") + '</span>' + how + ed;
    }).join("");
    const ents = d.entries.map(x => catTag(x.cat, hrs(x.hours) + " h") + (x.note ? ' <span class="hint">' + esc(x.note) + '</span>' : "") +
      "").join(" ");
    const live = w.clockedIn && dayKey(w.clockedIn.at) === d.key ? ' <span class="hint">(+' + hm(w.liveMin / 60) + ' so far)</span>' : "";
    return '<tr' + (wkend ? ' class="weekend"' : "") + '><td class="day">' + esc(fmtDay(d.key)) + '</td><td><div class="punches">' + (pairs || (d.entries.length ? "" : '<span class="hint">—</span>')) + '</div>' +
      (ents ? '<div class="flags" style="margin-top:6px">' + ents + '</div>' : "") + '</td><td class="num">' + (d.worked ? hrs(d.worked) + live : live || "") + '</td>' + (admin ? '<td class="num no-print"><button class="btn btn-secondary mini" type="button" data-day="' + d.key + '">Edit</button></td>' : "") + '</tr>';
  }).join("");
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Day</th><th>Time in – time out</th><th class="num">Hours worked</th>' + (admin ? '<th class="no-print"></th>' : "") + '</tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td>Total</td><td></td><td class="num">' + hrs(w.worked) + '</td>' + (admin ? '<td class="no-print"></td>' : "") + '</tr></tfoot></table></div>';
}
/* for the manager: where a phone punch happened (a link to the map), or that the phone didn't share it */
function locBit(pt) {
  if (!pt || !pt.phone) return "";
  const lbl = pt.dir === "in" ? "in" : "out";
  if (pt.loc && pt.loc.lat != null) return ' <a class="loc" href="https://maps.google.com/?q=' + pt.loc.lat + "," + pt.loc.lng + '" target="_blank" rel="noopener" title="Where the phone was when clocking ' + lbl + ' (within about ' + (pt.loc.acc || "?") + ' m)">📍 ' + lbl + ' location</a>';
  const why = { denied: "location turned off for this site", timeout: "the phone took too long", unavailable: "the phone couldn't tell", unsupported: "the phone can't share it" }[(pt.loc && pt.loc.err) || ""] || "not shared";
  return ' <span class="tag warn" title="Clocked ' + lbl + ' on a phone, but no location: ' + esc(why) + '">no ' + lbl + ' location</span>';
}
function statsBlock(w, bal) {
  const s = (l, v, hi, em) => '<div class="stat' + (hi ? " hi" : "") + '"><span>' + l + '</span><b>' + v + '</b>' + (em || "") + '</div>';
  const off = r2(w.pto + w.sick + w.holiday);
  const offBits = [w.pto ? "PTO " + hrs(w.pto) : "", w.sick ? "Sick " + hrs(w.sick) : "", w.holiday ? "Holiday " + hrs(w.holiday) : ""].filter(Boolean).join(" · ");
  return '<div class="stats">' + s("Hours worked", hrs(w.worked), false) +
    (w.ot ? s("Overtime", hrs(w.ot), false, '<em style="color:var(--' + (w.otStatus === "approved" ? "good" : "warn") + ')">' + (w.otStatus === "approved" ? "Approved" : "Needs approval") + '</em>') : "") +
    (off ? s("Time off & holidays", hrs(off), false, '<em class="hint">' + esc(offBits) + '</em>') : "") + s("Total paid", hrs(w.total), true) + '</div>' +
    (bal ? '<p class="hint">Time off left: <b>' + hrs(bal.pto) + ' h PTO</b> · <b>' + hrs(bal.sick) + ' h sick leave</b></p>' : "");
}

/* where a phone is when it clocks in or out; gives up after a few seconds so it never holds up the punch */
function getLoc(ms = 8000) {
  return new Promise(res => {
    let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
    if (!navigator.geolocation) return fin({ err: "unsupported" });
    setTimeout(() => fin({ err: "timeout" }), ms);
    try {
      navigator.geolocation.getCurrentPosition(p => fin({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
        e => fin({ err: e && e.code === 1 ? "denied" : e && e.code === 3 ? "timeout" : "unavailable" }), { enableHighAccuracy: true, timeout: ms - 500, maximumAge: 60000 });
    } catch (_) { fin({ err: "unavailable" }); }
  });
}

  if (tab === "cards") { try { await syncNow(); } catch (_) {} }   // pick up payroll done by the 5 PM email and punches from other computers
  await loadEmps();
  view().innerHTML = navBar(tab) + '<div id="pane" style="display:grid;gap:18px"></div>';
  wireNav();
  const P = $("#pane");
  if (tab === "cards") {
    const reqs = await loadRequests();
    const pend = reqs.filter(r => r.status === "pending" && D.emps.some(e => e.id === r.emp));
    const otPend = [];
    for (const n of [0, -1, -2, -3]) { const wk = shiftWeek(weekOf(new Date()), n); for (const e of active().filter(e => e.hourly !== false)) { const w = await weekFor(e, wk); if (w.otStatus === "pending" || w.otStatus === "changed") otPend.push(w); } }

  return paneSettings(P, opts.year || new Date().getFullYear(), opts.open);
}

    const st = pst[w.emp.id];

    return f.join("");

/* ================================================================ payroll (for the payroll company)
   Doing payroll locks the week and saves the hours paid. When payroll is done before the week is over
   (on Thursday), the rest of the week is estimated. Once the real times are in, any difference is added
   to the next payroll automatically, as a correction for that week. */
const { PK, ZERO, sgn, weekOver, paidEarly, shortDay, carriedFor, payState, correctionsFor } = PAY;
const monthKey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const monthLabel = (k) => { const [y, m] = k.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
async function doPayroll(wk, ws) {
  await syncNow(); await loadEmps();
  const estDays = PAY.estimateDays(wk);
  const people = PAY.payPeople(wk, D.emps);
  const sugg = {};
  for (const w of people) { sugg[w.emp.id] = {}; for (const k of estDays) sugg[w.emp.id][k] = PAY.suggestFor(w, wk, k); }
  const corr = PAY.correctionsAll(wk, D.emps);
  const corrList = Object.keys(corr).flatMap(id => corr[id].map(c => Object.assign({ id }, c)));
  const pendOt = people.filter(w => w.otStatus === "pending" || w.otStatus === "changed").length, miss = people.filter(w => w.issues.length).length;
  const warn = [pendOt ? pendOt + " overtime approval" + (pendOt > 1 ? "s are" : " is") + " still waiting" : "", miss ? miss + " time card" + (miss > 1 ? "s have" : " has") + " a missed punch" : "",
    corrList.some(c => c.missed) ? "a correction below comes from a week with a missed punch" : ""].filter(Boolean);
  const soFar = PAY.soFar;
  const v = await ask({ title: "Payroll for " + weekLc(wk), wide: true, html:
    (estDays.length ? '<p>The week isn\'t over yet, so enter the hours you expect each person to work on ' + estDays.map(k => fmtDay(k)).join(" and ") + '. The numbers are filled in from their usual hours. Once the real times are in, any difference is added to the next payroll automatically.</p>' +
      '<div class="tbl-wrap"><table class="tbl est-t"><thead><tr><th>Employee</th><th class="num">Worked so far</th>' + estDays.map(k => '<th class="num">' + esc(fmtDay(k)) + '</th>').join("") + '</tr></thead><tbody>' +
      people.map(w => '<tr><td><b>' + esc(fullName(w.emp)) + '</b></td><td class="num">' + hrs(soFar(w)) + '</td>' + estDays.map(k => '<td class="num"><input type="number" class="est-in" data-est="' + w.emp.id + '|' + k + '" min="0" max="24" step="0.25" value="' + sugg[w.emp.id][k] + '" aria-label="' + esc(fullName(w.emp) + ", " + fmtDay(k)) + ' hours"></td>').join("") + '</tr>').join("") + '</tbody></table></div>'
      : '<p>This makes the payroll sheet for ' + weekLc(wk) + ' and locks the week.</p>') +
    (corrList.length ? '<p><b>Corrections from earlier weeks</b> (added to this payroll):</p><ul class="plain">' + corrList.map(c => '<li>' + esc(nameOf(c.id)) + ', ' + esc(weekLc(c.wk)) + ': ' + sgn(c.total) + ' h (paid ' + hrs(c.paid) + ', actual ' + hrs(c.actual) + ')' + (c.missed ? ' <span class="tag bad">missed punch</span>' : "") + '</li>').join("") + '</ul>' : "") +
    (warn.length ? '<div class="note warn"><b>Before you send it</b><span>' + esc(warn.join("; ")) + '. You can still do payroll now.</span></div>' : "") + '<p class="err" id="perr"></p>',
    buttons: [{ label: "Cancel", value: false }, { label: "Make the payroll sheet", value: true, kind: "btn-primary", check: () => {
      for (const i of $$(".est-in")) { const n = Number(i.value); if (i.value === "" || !(n >= 0 && n <= 24)) { $("#perr").textContent = "Enter hours from 0 to 24 for each day (0 if they won't work)."; i.focus(); return false; } }
      return true;
    } }] });
  if (!v) return;
  const snapshot = PAY.makeSnapshot(people, estDays, (id, k) => $('[data-est="' + id + '|' + k + '"]').value, corr);
  await addWeekMeta(wk, { type: "lock", snapshot, early: estDays.length > 0 });
  await logChange("Did payroll for " + weekLc(wk) + (estDays.length ? " (" + estDays.map(fmtDay).join(", ") + " estimated)" : "") + (corrList.length ? "; corrections for earlier weeks included" : ""));
  for (const w of people) {
    if (w.emp.active === false) continue;
    await notify(w.emp.id, PAY.paidNotice(snapshot[w.emp.id], wk));
  }
  await mailIfLate(wk);
  go("payroll", { wk });
}

/* ================================================================ monthly PTO and sick hours */
async function monthlyTimeOff() {
  const now = new Date();
  const opts = [-1, 0, 1].map(n => monthKey(new Date(now.getFullYear(), now.getMonth() + n, 1)));
  const people = active();
  const L = {}, B = {};
  for (const e of people) { L[e.id] = await ledger(e.id); B[e.id] = await balances(e); }
  const added = (id, mk, cat) => r2(L[id].filter(x => x.ref === "month:" + mk && x.cat === cat).reduce((a, x) => a + x.hours, 0));
  const loaded = (mk) => people.filter(e => added(e.id, mk, "pto") || added(e.id, mk, "sick"));
  const mk0 = loaded(opts[1]).length ? opts[2] : opts[1];
  const val = (x) => Number(x) > 0 ? Number(x) : 0;
  const v = await ask({ title: "Add monthly PTO and sick hours", wide: true, html:
    '<p class="muted">Adds the hours each person earned to their balance. The amounts are remembered, so next month you just check them and save.</p>' +
    '<div class="field" style="max-width:260px"><label for="mm">Month</label><select id="mm">' + opts.map(k => '<option value="' + k + '"' + (k === mk0 ? " selected" : "") + '>' + esc(monthLabel(k)) + '</option>').join("") + '</select></div>' +
    '<div class="note warn" id="mwarn" hidden></div>' +
    '<div class="tbl-wrap"><table class="tbl est-t"><thead><tr><th>Employee</th><th class="num">PTO left</th><th class="num">Add PTO</th><th class="num">Sick left</th><th class="num">Add sick</th></tr></thead><tbody>' +
    people.map(e => '<tr><td><b>' + esc(fullName(e)) + '</b></td><td class="num">' + hrs(B[e.id].pto) + '</td><td class="num"><input type="number" class="est-in" data-m="' + e.id + '|pto" min="0" max="200" step="0.25" value="' + val(e.monthPto) + '" aria-label="' + esc(fullName(e)) + ' PTO to add"></td>' +
      '<td class="num">' + hrs(B[e.id].sick) + '</td><td class="num"><input type="number" class="est-in" data-m="' + e.id + '|sick" min="0" max="200" step="0.25" value="' + val(e.monthSick) + '" aria-label="' + esc(fullName(e)) + ' sick hours to add"></td></tr>').join("") + '</tbody></table></div>' +
    '<p class="hint">Put 0 for anyone who doesn\'t earn it. To take hours away or fix a balance, use Edit next to their name.</p><p class="err" id="merr"></p>',
    buttons: [{ label: "Cancel", value: false }, { label: "Add hours", value: true, kind: "btn-primary", check: () => {
      for (const i of $$("[data-m]")) { const n = Number(i.value); if (i.value !== "" && !(n >= 0)) { $("#merr").textContent = "Use 0 or more hours."; i.focus(); return false; } }
      if (!$$("[data-m]").some(i => Number(i.value) > 0)) { $("#merr").textContent = "Enter the hours to add for at least one person."; return false; }
      return true;
    } }],
    onOpen: () => {
      const upd = () => { const mk = $("#mm").value; const got = loaded(mk); const w = $("#mwarn"); w.hidden = !got.length;
        w.innerHTML = got.length ? '<b>Already added for ' + esc(monthLabel(mk)) + '</b><span>' + got.map(e => esc(fullName(e)) + ": " + [added(e.id, mk, "pto") ? "PTO " + hrs(added(e.id, mk, "pto")) + " h" : "", added(e.id, mk, "sick") ? "sick " + hrs(added(e.id, mk, "sick")) + " h" : ""].filter(Boolean).join(", ")).join("; ") + '. Saving adds more on top.</span>' : ""; };
      $("#mm").addEventListener("change", upd); upd();
    } });
  if (!v) return;
  const mk = $("#mm").value, name = monthLabel(mk).split(" ")[0]; const log = [];
  for (const e of people) {
    const p = r2(Number($('[data-m="' + e.id + '|pto"]').value) || 0), s = r2(Number($('[data-m="' + e.id + '|sick"]').value) || 0);
    if (p) await addLedger(e.id, "pto", p, "PTO earned for " + monthLabel(mk), "month:" + mk);
    if (s) await addLedger(e.id, "sick", s, "Sick leave earned for " + monthLabel(mk), "month:" + mk);
    if (val(e.monthPto) !== p || val(e.monthSick) !== s) { e.monthPto = p; e.monthSick = s; await saveEmp(e); }
    if (p || s) {
      log.push(fullName(e) + (p ? " PTO +" + hrs(p) : "") + (s ? " sick +" + hrs(s) : ""));
      await notify(e.id, "Your earned time off for " + name + " was added: " + [p ? "+" + hrs(p) + " h PTO" : "", s ? "+" + hrs(s) + " h sick leave" : ""].filter(Boolean).join(", ") + ". You now have " + hrs(B[e.id].pto + p) + " h PTO and " + hrs(B[e.id].sick + s) + " h sick leave.", { v: "me" });
    }
  }
  await logChange("Added earned time off for " + monthLabel(mk) + ": " + log.join("; "));
  toast("Added " + name + "'s PTO and sick hours."); go("manage", { tab: "team" });
}

/* classic paper time sheet, one page per person */
function sheetHtml(w, bal) {
  const lines = [];
  w.days.forEach((d, i) => {
    const pairs = d.pairs.slice();
    if (i >= 5 && !pairs.length && !d.worked) return;
    const chunks = []; for (let k = 0; k < Math.max(1, pairs.length); k += 2) chunks.push(pairs.slice(k, k + 2));
    chunks.forEach((c, j) => {
      const cell = (p, side) => p && p[side] ? fmtTime(p[side].at) : p && side === "out" && p.live ? "(clocked in)" : p ? "—" : "";
      const other = j === 0 ? d.entries.filter(x => x.cat !== "worked").map(x => (CATS[x.cat] || x.cat) + " " + hrs(x.hours)).join(", ") : "";
      lines.push('<tr><td>' + (j === 0 ? esc(DAYS[i]) : "") + '</td><td>' + (j === 0 ? esc(fmtDate(d.key)) : "") + '</td><td>' + cell(c[0], "in") + '</td><td>' + cell(c[0], "out") + '</td><td>' + cell(c[1], "in") + '</td><td>' + cell(c[1], "out") + '</td>' +
        '<td class="num">' + (j === 0 && d.worked ? hrs(d.worked) : "") + '</td><td>' + esc(other) + '</td></tr>');
    });
  });
  const otTxt = w.ot ? hrs(w.ot) + (w.otStatus === "approved" ? " (approved)" : " (not yet approved)") : "0.00";
  return '<section class="sheet"><div class="sh-head"><img src="brand/masterpiece-logo.svg" alt="" class="sh-logo"><div><h1>Employee Time Sheet</h1><p>Masterpiece Construction Experts</p></div></div>' +
    '<table class="sh-info"><tr><th>Name</th><td>' + esc(fullName(w.emp)) + '</td><th>Week ending</th><td>' + esc(fmtLong(fridayOf(w.wk))) + '</td></tr>' +
    '<tr><th>Position</th><td>' + esc(w.emp.position || "") + '</td><th>Week</th><td>' + esc(weekRange(w.wk)) + '</td></tr></table>' +
    '<table class="sh-grid"><thead><tr><th>Day</th><th>Date</th><th>Time in</th><th>Time out</th><th>Time in</th><th>Time out</th><th class="num">Hours</th><th>PTO / sick / holiday</th></tr></thead><tbody>' + lines.join("") + '</tbody>' +
    '<tfoot><tr><td colspan="6">Total hours worked</td><td class="num">' + hrs(w.worked) + '</td><td></td></tr></tfoot></table>' +
    '<table class="sh-tot"><tr><th>Regular</th><th>Overtime</th><th>PTO</th><th>Sick</th><th>Holiday</th><th>Total paid hours</th></tr>' +
    '<tr><td>' + hrs(w.reg) + '</td><td>' + otTxt + '</td><td>' + hrs(w.pto) + '</td><td>' + hrs(w.sick) + '</td><td>' + hrs(w.holiday) + '</td><td><b>' + hrs(w.total) + '</b></td></tr></table>' +
    (bal ? '<p class="sh-bal">Balance when printed: PTO ' + hrs(bal.pto) + ' h · Sick leave ' + hrs(bal.sick) + ' h</p>' : "") +
    (w.issues.length ? '<p class="sh-bal">Missed punches: ' + w.issues.map(esc).join("; ") + '</p>' : "") +
    '<div class="sh-sign"><div>Employee signature<span></span>Date<span class="d"></span></div><div>Manager approval<span></span>Date<span class="d"></span></div></div>' +
    '<p class="sh-foot">Printed ' + esc(fmtStamp(Date.now())) + (w.signed && !w.changedAfterSign ? " · Confirmed by employee " + esc(fmtStamp(w.signed.created)) : "") + '</p></section>';
}
function printSheets(list) {

/* everything about one day in one place: change or remove times, add times, add or remove hours */
async function editDay(emp, wk, w, key) {
  const d = w.days.find(x => x.key === key);
  const pairRows = d.pairs.map((p, i) => '<div class="ed-row" data-pair="' + i + '"><div class="field"><label>Time in</label><input type="time" data-k="in" value="' + (p.in ? timeVal(p.in.at) : "") + '"' + (p.in ? "" : ' placeholder=""') + '></div>' +
    '<div class="field"><label>Time out</label><input type="time" data-k="out" value="' + (p.out ? timeVal(p.out.at) : "") + '"></div>' +
    '<label class="check"><input type="checkbox" data-k="rm"><span>Remove</span></label></div>').join("");
  const entRows = d.entries.filter(x => x.id || x.auto).map((x, i) => '<label class="check" data-ent="' + i + '"><input type="checkbox"><span>Remove ' + esc((CATS[x.cat] || x.cat) + " " + hrs(x.hours) + " h") + (x.note ? " (" + esc(x.note) + ")" : "") + (x.auto ? " for " + esc(emp.first) + " only" : "") + '</span></label>').join("");
  const ents = d.entries.filter(x => x.id || x.auto);
  const v = await ask({ title: fullName(emp) + ", " + fmtLong(key), wide: true, html: '<div class="edit-day">' +
    (pairRows ? '<b>Clock times</b>' + pairRows : '<p class="muted">No clock times this day.</p>') +
    '<b>Add a time in / out</b><div class="ed-row"><div class="field"><label for="ai">Time in</label><input type="time" id="ai"></div><div class="field"><label for="ao">Time out</label><input type="time" id="ao"></div><span></span></div>' +
    (entRows ? '<b>Other hours</b>' + entRows : "") +
    '<b>Add hours</b><div class="ed-row"><div class="field"><label for="hc">Kind</label><select id="hc"><option value="">None</option><option value="pto">PTO</option><option value="sick">Sick leave</option><option value="holiday">Holiday</option><option value="worked">Worked (no clock times)</option></select></div>' +
    '<div class="field"><label for="hh">Hours</label><input type="number" id="hh" value="8" min="0.25" max="24" step="0.25"></div><span></span></div>' +
    '<div class="field"><label for="why">Reason (shows in the change log)</label><input type="text" id="why"></div><p class="err" id="eerr"></p></div>',
    buttons: [{ label: "Cancel", value: false }, { label: "Save changes", value: true, kind: "btn-primary", check: () => {
      if ($("#ai").value && $("#ao").value && $("#ao").value <= $("#ai").value) { $("#eerr").textContent = "The new time out has to be after the time in."; return false; }
      for (const r of $$("[data-pair]")) { const a = $('[data-k="in"]', r).value, b = $('[data-k="out"]', r).value; if (a && b && b <= a && !$('[data-k="rm"]', r).checked) { $("#eerr").textContent = "Each time out has to be after its time in."; return false; } }
      if ($("#hc").value && !(Number($("#hh").value) > 0)) { $("#eerr").textContent = "Enter how many hours to add."; return false; }
      return true;
    } }] });
  if (!v) return false;
  const note = $("#why").value.trim(); const did = [];
  for (const r of $$("[data-pair]")) {
    const p = d.pairs[+r.dataset.pair];
    if ($('[data-k="rm"]', r).checked) {
      for (const x of [p.in, p.out].filter(Boolean)) await addEvent(wk, emp.id, { type: "void", target: x.id, note });
      did.push("removed " + [p.in && "in " + fmtTime(p.in.at), p.out && "out " + fmtTime(p.out.at)].filter(Boolean).join(" / ")); continue;
    }
    for (const side of ["in", "out"]) {
      const val = $('[data-k="' + side + '"]', r).value; const cur = p[side];
      if (cur && val && val !== timeVal(cur.at)) { const nt = at(key, val); await addEvent(wk, emp.id, { type: "move", target: cur.id, at: nt, note }); did.push("time " + side + " " + fmtTime(cur.at) + " → " + fmtTime(nt)); }
      if (!cur && val) { const nt = at(key, val); await addEvent(wk, emp.id, { type: "punch", dir: side, at: nt, how: "added", note }); did.push("added time " + side + " " + fmtTime(nt)); }
    }
  }
  for (const side of ["in", "out"]) { const val = $(side === "in" ? "#ai" : "#ao").value; if (val) { const nt = at(key, val); await addEvent(wk, emp.id, { type: "punch", dir: side, at: nt, how: "added", note }); did.push("added time " + side + " " + fmtTime(nt)); } }
  for (const el of $$("[data-ent]")) {
    if (!$("input", el).checked) continue;
    const x = ents[+el.dataset.ent];
    if (x.auto) { await addEvent(wk, emp.id, { type: "holiday_off", date: key }); did.push("removed holiday " + hrs(x.hours) + " h"); continue; }
    await addEvent(wk, emp.id, { type: "void", target: x.id, note });
    if (x.cat === "pto" || x.cat === "sick") await addLedger(emp.id, x.cat, x.hours, "Removed from " + fmtDay(key));
    did.push("removed " + (CATS[x.cat] || x.cat) + " " + hrs(x.hours) + " h");
  }
  const cat = $("#hc").value;
  if (cat) {
    const h = r2(Number($("#hh").value));
    await addEvent(wk, emp.id, { type: "hours", cat, date: key, hours: h, note });
    if (cat === "pto" || cat === "sick") await addLedger(emp.id, cat, -h, CATS[cat] + " on " + fmtDay(key));
    did.push("added " + CATS[cat] + " " + hrs(h) + " h");
  }
  if (!did.length) return false;
  await logChange(fullName(emp) + ", " + fmtDay(key) + ": " + did.join("; ") + (note ? " (" + note + ")" : ""));
  if (emp.id !== S.emp.id) await notify(emp.id, nameOf(S.emp.id).split(" ")[0] + " updated your time card for " + fmtDay(key) + ": " + did.join("; ") + ".", { v: "me", wk });
  toast("Saved.");
  return true;
}
/* approvals */
async function paneApprovals(P, pend, otPend) {
  const bal = {};
  for (const r of pend) if (r.kind !== "fix" && !bal[r.emp]) { const e = D.emps.find(x => x.id === r.emp); if (e) bal[r.emp] = await balances(e); }
  const balNote = (r) => { const b = bal[r.emp]; if (!b || r.kind === "fix") return ""; const left = b[r.kind]; const need = r.hours * (r.dates || [r.date]).length;
    return ' · balance ' + hrs(left) + ' h' + (need > left + 0.001 ? ' (not enough, would go to ' + hrs(left - need) + ' h)' : ""); };
  P.innerHTML = '<div class="card wait"><div class="card-head"><h3>Waiting for your approval</h3></div>' +
    (pend.length || otPend.length ? '<div class="list">' +
      otPend.map(w => '<div class="item-row"><div><span class="t">Overtime: ' + esc(fullName(w.emp)) + ', ' + hrs(w.ot) + ' h</span><span class="s">' + esc(weekLabel(w.wk)) + ' · ' + hrs(w.worked) + ' h worked' + (w.otStatus === "changed" ? " · changed since you approved " + hrs(w.otApproved) + " h" : "") + '</span></div>' +
        '<div class="row"><button class="btn btn-secondary mini" data-view="' + w.emp.id + '|' + w.wk + '">View time card</button><button class="btn btn-primary mini" data-ot="' + w.emp.id + '|' + w.wk + '|' + w.ot + '">Approve</button></div></div>').join("") +
      pend.map(r => '<div class="item-row"><div><span class="t">' + esc(nameOf(r.emp)) + ': ' + esc(reqTitle(r)) + '</span><span class="s">' + esc(reqDetail(r)) + esc(balNote(r)) + ' · sent ' + esc(fmtStamp(r.created)) + '</span></div>' +
        '<div class="row"><button class="btn btn-secondary mini" data-deny="' + r.id + '">Don\'t approve</button><button class="btn btn-primary mini" data-approve="' + r.id + '">Approve</button></div></div>').join("") + '</div>'
      : '<p class="muted">Nothing waiting. 🎉</p>') + '</div>';
  $$("[data-view]").forEach(b => b.addEventListener("click", () => { const [id, wk] = b.dataset.view.split("|"); go("empweek", { id, wk }); }));
  $$("[data-ot]").forEach(b => b.addEventListener("click", async () => {
    const [id, wk, h] = b.dataset.ot.split("|");
    await addEvent(wk, id, { type: "ot", hours: Number(h) }); await logChange("Approved " + hrs(Number(h)) + " h overtime for " + nameOf(id) + ", " + weekLc(wk));
    await notify(id, "Your " + hrs(Number(h)) + " h of overtime for " + weekLc(wk) + " was approved.");
    toast("Overtime approved."); go("manage", { tab: "cards" });
  }));
  const decide = async (rid, ok) => {
    const r = pend.find(x => x.id === rid); if (!r) return;
    const v = await ask({ title: (ok ? "Approve " : "Don't approve ") + nameOf(r.emp).split(" ")[0] + "'s request?", text: reqTitle(r) + " · " + reqDetail(r),
      html: '<div class="field"><label for="rp">Note to ' + esc(nameOf(r.emp).split(" ")[0]) + ' (optional)</label><input type="text" id="rp"></div>',
      buttons: [{ label: "Cancel", value: false }, { label: ok ? "Approve" : "Don't approve", value: true, kind: ok ? "btn-primary" : "btn-danger-solid" }] });
    if (!v) return;
    r.reply = $("#rp") ? $("#rp").value.trim() : "";
    if (ok) {
      if (r.kind === "fix") {
        const wk = weekOf(fromKey(r.date));
        if (r.inTime) await addEvent(wk, r.emp, { type: "punch", dir: "in", at: at(r.date, r.inTime), how: "request", note: r.note, req: r.id });
        if (r.outTime) await addEvent(wk, r.emp, { type: "punch", dir: "out", at: at(r.date, r.outTime), how: "request", note: r.note, req: r.id });
      } else {
        for (const d of r.dates || [r.date]) {
          await addEvent(weekOf(fromKey(d)), r.emp, { type: "hours", cat: r.kind, date: d, hours: r.hours, note: r.note, req: r.id });
          await addLedger(r.emp, r.kind, -r.hours, CATS[r.kind] + " on " + fmtDay(d));
        }
      }
    }
    r.status = ok ? "approved" : "denied"; r.decidedBy = S.emp.id; r.decided = Date.now();
    await saveRequest(r); await logChange((ok ? "Approved " : "Didn't approve ") + nameOf(r.emp) + "'s request: " + reqTitle(r) + " (" + reqDetail(r) + ")");
    await notify(r.emp, "Your request (" + reqTitle(r) + ") was " + (ok ? "approved" : "not approved") + "." + (r.reply ? " " + nameOf(S.emp.id).split(" ")[0] + ": " + r.reply : ""));
    toast(ok ? "Approved." : "Marked as not approved."); go("manage", { tab: "cards" });
  };
  $$("[data-approve]").forEach(b => b.addEventListener("click", () => decide(b.dataset.approve, true)));
  $$("[data-deny]").forEach(b => b.addEventListener("click", () => decide(b.dataset.deny, false)));
}

/* ================================================================ summaries for taxes and records */
function quickRange(k) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), q = Math.floor(m / 3);
  const R = (a, b) => [dayKey(a), dayKey(b)];
  switch (k) {
    case "thisMonth": return R(new Date(y, m, 1), new Date(y, m + 1, 0));
    case "lastMonth": return R(new Date(y, m - 1, 1), new Date(y, m, 0));
    case "thisQuarter": return R(new Date(y, q * 3, 1), new Date(y, q * 3 + 3, 0));
    case "lastQuarter": return R(new Date(y, q * 3 - 3, 1), new Date(y, q * 3, 0));
    case "thisYear": return R(new Date(y, 0, 1), new Date(y, 11, 31));
    case "lastYear": return R(new Date(y - 1, 0, 1), new Date(y - 1, 11, 31));
  }
  return null;
}

/* gathers everything for a date range. Weeks count toward the range by their week-ending Friday, the way payroll does. */
async function buildReport({ from, to, who }) {
  await syncNow(); await loadEmps();
  const people = D.emps.filter(e => e.hourly !== false && (!who || e.id === who));
  const weeks = []; for (let wk = weekOf(fromKey(from)); fridayOf(wk) <= to; wk = shiftWeek(wk, 1)) if (fridayOf(wk) >= from) weeks.push(wk);
  const endT = addDays(fromKey(to), 1).getTime(), startT = fromKey(from).getTime();
  const metas = {}; for (const wk of weeks) metas[wk] = await weekMeta(wk);
  const out = [];
  for (const e of people) {
    const ws = []; for (const wk of weeks) ws.push(await weekFor(e, wk));
    const L = await ledger(e.id);
    const inRange = L.filter(x => x.t >= startT && x.t < endT);
    const sum = (k) => r2(ws.reduce((a, w) => a + w[k], 0));
    const bal = (cat) => r2((Number(e[cat + "Start"]) || 0) + L.filter(x => x.cat === cat && x.t < endT).reduce((a, x) => a + x.hours, 0));
    const earned = (cat) => r2(inRange.filter(x => x.cat === cat && x.hours > 0).reduce((a, x) => a + x.hours, 0));
    const p = { emp: e, ws, worked: sum("worked"), reg: sum("reg"), ot: sum("ot"), pto: sum("pto"), sick: sum("sick"), holiday: sum("holiday"), total: sum("total"),
      ptoEarned: earned("pto"), sickEarned: earned("sick"), ptoLeft: bal("pto"), sickLeft: bal("sick"), ledger: inRange,
      weeksWorked: ws.filter(w => w.total > 0).length, otUnapproved: r2(ws.filter(w => w.otStatus === "pending" || w.otStatus === "changed").reduce((a, w) => a + w.ot, 0)),
      missed: ws.reduce((a, w) => a + w.issues.length, 0), unconfirmed: ws.filter(w => w.total > 0 && !(w.signed && !w.changedAfterSign)).length };
    if (p.total > 0 || e.active !== false) out.push(p);
  }
  const months = {};
  for (const p of out) for (const w of p.ws) {
    const mk = fridayOf(w.wk).slice(0, 7); const m = months[mk] = months[mk] || { reg: 0, ot: 0, pto: 0, sick: 0, holiday: 0, total: 0 };
    for (const k of Object.keys(m)) m[k] = r2(m[k] + w[k]);
  }
  const tot = (k) => r2(out.reduce((a, p) => a + p[k], 0));
  return { from, to, weeks, people: out, months, metas, unlocked: weeks.filter(wk => !metas[wk].locked && out.some(p => p.ws.find(w => w.wk === wk).total > 0)),
    totals: { worked: tot("worked"), reg: tot("reg"), ot: tot("ot"), pto: tot("pto"), sick: tot("sick"), holiday: tot("holiday"), total: tot("total"), ptoEarned: tot("ptoEarned"), sickEarned: tot("sickEarned") } };
}
