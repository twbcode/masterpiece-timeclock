      mkeys.map(k => { const m = R.months[k]; return '<tr><td>' + esc(monthName(k)) + '</td><td class="num">' + hrs(m.reg) + '</td><td class="num">' + hrs(m.ot) + '</td><td class="num">' + hrs(m.pto) + '</td><td class="num">' + hrs(m.sick) + '</td><td class="num">' + hrs(m.holiday) + '</td><td class="num"><b>' + hrs(m.total) + '</b></td></tr>'; }).join("") + '</tbody></table>' : "");
  const review = [];
  if (R.unlocked.length) review.push(R.unlocked.length + " week" + (R.unlocked.length > 1 ? "s" : "") + " with no payroll done: " + R.unlocked.map(wk => fmtDate(fridayOf(wk))).join(", ") + ".");
  R.people.forEach(p => {
    if (p.otUnapproved) review.push(fullName(p.emp) + ": " + hrs(p.otUnapproved) + " h overtime not approved.");
    if (p.missed) review.push(fullName(p.emp) + ": " + p.missed + " missed punch" + (p.missed > 1 ? "es" : "") + " not fixed.");
    if (p.unconfirmed) review.push(fullName(p.emp) + ": " + p.unconfirmed + " week" + (p.unconfirmed > 1 ? "s" : "") + " not confirmed by the employee.");
  });
  h += '<h2 class="rp-h">Good to know</h2><ul class="rp-notes">' + (review.length ? review.map(x => '<li>' + esc(x) + '</li>').join("") : '<li>Every week has payroll done, is confirmed and has no missed punches.</li>') +
    '<li>Pay weeks run Monday to Sunday and count toward the dates by their week-ending Friday, the same way payroll does. Overtime is hours worked over ' + OT_LIMIT + ' in a pay week.</li></ul></section>';
  if (detail) for (const p of R.people) {
    h += '<section class="rp-page rp-break"><div class="rp-head small"><div><h1>' + esc(fullName(p.emp)) + '</h1><p>' + esc(p.emp.position || "") + ' · ' + esc(rangeText(R.from, R.to)) + '</p></div></div>' +
      '<div class="rs-row">' + stat("Regular", hrs(p.reg)) + stat("Overtime", hrs(p.ot)) + stat("PTO used", hrs(p.pto)) + stat("Sick used", hrs(p.sick)) + stat("Holiday", hrs(p.holiday)) + stat("Total paid", hrs(p.total)) + stat("PTO left", hrs(p.ptoLeft)) + stat("Sick left", hrs(p.sickLeft)) + '</div>';
    if (p.ledger.length) h += '<h2 class="rp-h">PTO and sick balance changes</h2><table class="rp-t"><thead><tr><th>Date</th><th>Kind</th><th class="num">Hours</th><th>Why</th></tr></thead><tbody>' +
      p.ledger.map(x => '<tr><td>' + esc(fmtDate(dayKey(x.t))) + '</td><td>' + (x.cat === "pto" ? "PTO" : "Sick") + '</td><td class="num">' + (x.hours > 0 ? "+" : "") + hrs(x.hours) + '</td><td>' + esc(x.note || "") + '</td></tr>').join("") + '</tbody></table>';
    const worked = p.ws.filter(w => w.total > 0 || w.punches.length);
    if (!worked.length) h += '<p class="rp-sub">No hours in these dates.</p>';
    for (const w of worked) {
      h += '<div class="rp-week"><h3>' + esc(weekLabel(w.wk)) + (R.metas[w.wk].locked ? " · paid" : "") + '</h3><table class="rp-t"><thead><tr><th>Day</th><th>Time in – time out</th><th class="num">Worked</th><th class="num">PTO</th><th class="num">Sick</th><th class="num">Holiday</th><th>Notes</th></tr></thead><tbody>' +
        w.days.map((d, i) => {
          if (i >= 5 && !d.pairs.length && !d.entries.length) return "";
          const pairs = d.pairs.map(pr => (pr.in ? fmtTime(pr.in.at) : "—") + " – " + (pr.out ? fmtTime(pr.out.at) : pr.live ? "still in" : "—")).join(", ");
          const c = (k) => d.entries.filter(x => x.cat === k).reduce((a, x) => a + x.hours, 0);
          const notes = [d.issues.length ? "Missed punch" : "", d.entries.filter(x => x.note && x.cat !== "worked").map(x => x.note).join(", ")].filter(Boolean).join("; ");
          return '<tr><td>' + esc(fmtDay(d.key)) + '</td><td>' + esc(pairs || "—") + '</td><td class="num">' + (d.worked ? hrs(d.worked) : "") + '</td><td class="num">' + (c("pto") ? hrs(c("pto")) : "") + '</td><td class="num">' + (c("sick") ? hrs(c("sick")) : "") + '</td><td class="num">' + (c("holiday") ? hrs(c("holiday")) : "") + '</td><td>' + esc(notes) + '</td></tr>';
        }).join("") + '</tbody><tfoot><tr><td colspan="2">Regular ' + hrs(w.reg) + ' · Overtime ' + hrs(w.ot) + (w.ot ? (w.otStatus === "approved" ? " (approved)" : " (not approved)") : "") + '</td><td class="num">' + hrs(w.worked) + '</td><td class="num">' + hrs(w.pto) + '</td><td class="num">' + hrs(w.sick) + '</td><td class="num">' + hrs(w.holiday) + '</td><td><b>' + hrs(w.total) + ' paid</b></td></tr></tfoot></table></div>';
    }
    h += '</section>';
  }
  return h;
}
function reportCsv(R, detail) {
  const rows = [["Masterpiece Construction Experts time card summary", rangeText(R.from, R.to)], ["Pay weeks counted by their week-ending Friday"], [],
    ["Employee", "Position", "Regular hours", "Overtime hours", "PTO used", "Sick used", "Holiday hours", "Total paid hours", "PTO earned", "Sick earned", "PTO left", "Sick left", "Weeks with hours"]];
  for (const p of R.people) rows.push([fullName(p.emp), p.emp.position || "", hrs(p.reg), hrs(p.ot), hrs(p.pto), hrs(p.sick), hrs(p.holiday), hrs(p.total), hrs(p.ptoEarned), hrs(p.sickEarned), hrs(p.ptoLeft), hrs(p.sickLeft), p.weeksWorked]);
  const T = R.totals; rows.push(["All employees", "", hrs(T.reg), hrs(T.ot), hrs(T.pto), hrs(T.sick), hrs(T.holiday), hrs(T.total), hrs(T.ptoEarned), hrs(T.sickEarned)]);
  if (detail) {
    rows.push([], ["Day by day"], ["Employee", "Week ending", "Date", "Times in and out", "Worked", "PTO", "Sick", "Holiday", "Notes"]);
    for (const p of R.people) for (const w of p.ws) for (const d of w.days) {
      if (!d.pairs.length && !d.entries.length) continue;
      const c = (k) => d.entries.filter(x => x.cat === k).reduce((a, x) => a + x.hours, 0);
      rows.push([fullName(p.emp), fridayOf(w.wk), d.key, d.pairs.map(pr => (pr.in ? fmtTime(pr.in.at) : "?") + "-" + (pr.out ? fmtTime(pr.out.at) : "?")).join("; "), hrs(d.worked), hrs(c("pto")), hrs(c("sick")), hrs(c("holiday")), d.issues.length ? "Missed punch" : ""]);
    }
  }
  return rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
async function viewReport(opts) {
  if (!S.emp || !S.emp.admin) return go("home");
  view().innerHTML = navBar("reports") + '<div class="card"><div class="busy"><span class="spin"></span>Putting the summary together…</div></div>';
  wireNav();
  const R = await buildReport(opts);
  view().innerHTML = navBar("reports") +
    '<div class="page-head no-print"><button class="btn btn-text" type="button" id="back">← Reports</button><div class="row"><button class="btn btn-secondary" type="button" id="rcsv">Download spreadsheet</button><button class="btn btn-primary" type="button" id="rprint">Print</button></div></div>' +
    '<div class="card report">' + reportHtml(R, opts.detail) + '</div>';
  wireNav();
  $("#back").addEventListener("click", () => go("manage", { tab: "reports", last: opts }));
  $("#rprint").addEventListener("click", () => {
    let area = $("#print-area"); if (!area) { area = document.createElement("div"); area.id = "print-area"; document.body.appendChild(area); }
    area.innerHTML = '<div class="report">' + reportHtml(R, opts.detail) + '</div>';
    document.body.classList.add("printing");
    const done = () => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    setTimeout(() => { window.print(); setTimeout(done, 1500); }, 300);
  });
  $("#rcsv").addEventListener("click", () => download("Time card summary " + R.from + " to " + R.to + ".csv", reportCsv(R, opts.detail)));
  await logChange("Created a time card summary for " + rangeText(R.from, R.to) + (opts.detail ? " (with details)" : ""));
}
